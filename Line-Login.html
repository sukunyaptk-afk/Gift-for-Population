n value="">ปี พ.ศ.</option><sc-for list="{{years}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.n}}</option></sc-for></select></div></div>

<script>mountDC(document.getElementById('app'),document.getElementById('tpl').textContent,"\nclass Component extends DCLogic {\nrenderVals() {\n  const s = this.state || {};\n  const g = (k) => s[k] ?? '';\n  const set = (k) => (e) => this.setState({[k]: e.target.value});\n  const vals = ['cid','pre','fn','ln','d','m','y','tel'].map(g);\n  const dis = vals.some((v) => !v);\n  const showForm = ('form' in s) ? !!s.form : !!this.props.formOpen;\n  return {\n    cid: g('cid'), pre: g('pre'), fn: g('fn'), ln: g('ln'), d: g('d'), m: g('m'), y: g('y'), tel: g('tel'),\n    setCid: set('cid'), setPre: set('pre'), setFn: set('fn'), setLn: set('ln'), setD: set('d'), setM: set('m'), setY: set('y'), setTel: set('tel'),\n    pres: ['\u0e19\u0e32\u0e22','\u0e19\u0e32\u0e07','\u0e19\u0e32\u0e07\u0e2a\u0e32\u0e27','\u0e40\u0e14\u0e47\u0e01\u0e0a\u0e32\u0e22','\u0e40\u0e14\u0e47\u0e01\u0e2b\u0e0d\u0e34\u0e07'].map((v) => ({v, n: v})),\n    days: Array.from({length: 31}, (_, i) => ({v: i + 1, n: i + 1})),\n    months: ['\u0e21.\u0e04.','\u0e01.\u0e1e.','\u0e21\u0e35.\u0e04.','\u0e40\u0e21.\u0e22.','\u0e1e.\u0e04.','\u0e21\u0e34.\u0e22.','\u0e01.\u0e04.','\u0e2a.\u0e04.','\u0e01.\u0e22.','\u0e15.\u0e04.','\u0e1e.\u0e22.','\u0e18.\u0e04.'].map((n, i) => ({v: i + 1, n})),\n    years: Array.from({length: 101}, (_, i) => ({v: 2569 - i, n: 2569 - i})),\n    st: (() => { const a = this.props.altStyle || 'card'; return {card: a === 'card', outline: a === 'outline', link: a === 'link'}; })(),\n    subText: showForm ? '\u0e01\u0e23\u0e38\u0e13\u0e32\u0e01\u0e23\u0e2d\u0e01\u0e02\u0e49\u0e2d\u0e21\u0e39\u0e25\u0e2a\u0e33\u0e2b\u0e23\u0e31\u0e1a\u0e25\u0e07\u0e17\u0e30\u0e40\u0e1a\u0e35\u0e22\u0e19' : '\u0e01\u0e23\u0e38\u0e13\u0e32\u0e25\u0e47\u0e2d\u0e01\u0e2d\u0e34\u0e19\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e40\u0e02\u0e49\u0e32\u0e2a\u0e39\u0e48\u0e23\u0e30\u0e1a\u0e1a Doctor Assist',\n    showForm, closed: !showForm, openForm: () => this.setState({form: true}), closeForm: () => this.setState({form: false}), topPad: showForm ? '40px' : '120px', logoW: showForm ? '120px' : '170px',\n    dis, nextHref: 'Line-Appts.html',\n    btnSt: '',\n  };\n}\n}\n",{});</script>
